name: Deploy to Cloudflare

# Deployt bei jedem Push auf main. Voraussetzung (einmalig): in den GitHub-Repo-Einstellungen
# unter Settings → Secrets and variables → Actions die Secrets CLOUDFLARE_API_TOKEN und
# CLOUDFLARE_ACCOUNT_ID anlegen. Ohne diese Secrets wird der Schritt übersprungen.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Hinweis (keine Secrets gesetzt)
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN fehlt – Deploy übersprungen. Siehe README."
